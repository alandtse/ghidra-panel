repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    - id: check-yaml
    - id: end-of-file-fixer
    - id: trailing-whitespace
    - id: check-added-large-files
      args: ['--maxkb=1000']
    - id: check-merge-conflict
    - id: detect-private-key

  # Go-specific hooks (Customized for srepanel/ subdirectory)
  - repo: local
    hooks:
    - id: go-fmt
      name: go fmt
      entry: bash -c 'cd srepanel && go fmt ./...'
      language: system
      files: \.go$
      pass_filenames: false
    - id: go-vet
      name: go vet
      entry: bash -c 'cd srepanel && go vet ./...'
      language: system
      files: \.go$
      pass_filenames: false
    - id: go-unit-tests
      name: go test
      entry: bash -c 'cd srepanel && go test -short ./...'
      language: system
      files: \.go$
      pass_filenames: false

  # Optional: golangci-lint (more comprehensive but slower)
  # - repo: https://github.com/golangci/golangci-lint
  #   rev: v1.55.2
  #   hooks:
  #   - id: golangci-lint
  #     args: [--timeout=5m]
