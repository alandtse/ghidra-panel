name: Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  integration_jaas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run integration test
        run: |
          if [ -z "$GHIDRA_INSTALL_DIR" ]; then
            echo "GHIDRA_INSTALL_DIR not set, skipping integration test"
            echo "Integration tests require Ghidra installation - see GHIDRA_SERVER_SETUP.md"
            exit 0
          fi
          make integration
