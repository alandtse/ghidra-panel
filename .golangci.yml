# golangci-lint configuration for ghidra-panel
# See https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  modules-download-mode: readonly
  go: '1.24'

linters:
  enable:
    - errcheck      # Check for unchecked errors
    - gosimple      # Simplify code
    - govet         # Go vet (standard checks)
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Go static analysis
    - unused        # Check for unused code
    - gofmt         # Check code formatting
    - goimports     # Check import formatting
    - misspell      # Spell checker
    - revive        # Fast, configurable linter
    - gosec         # Security issues

  disable:
    - typecheck     # Can be slow and already done by compiler

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
    
  govet:
    enable-all: true
    disable:
      - shadow  # Too many false positives
      
  gosec:
    excludes:
      - G104  # Audit errors not checked (too noisy, errcheck handles this)
      - G304  # File path provided as taint input (we need to read config files)
      
  revive:
    rules:
      - name: exported
        disabled: true  # We don't always need comments on exported items
        
  misspell:
    locale: US

issues:
  exclude-rules:
    # Exclude some linters from test files
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        
    # Exclude generated protobuf files
    - path: ghidra/.*\.pb\.go
      linters:
        - all
        
  max-same-issues: 0
  max-issues-per-linter: 0
