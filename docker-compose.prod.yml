services:
  ghidra:
    image: ghcr.io/alandtse/ghidra-server:latest
    ports:
      - "13100:13100"
      - "13101:13101"
      - "13102:13102"
    volumes:
      - ghidra_repos:/repos
      - panel_data:/data
    environment:
      - GHIDRA_PUBLIC_HOSTNAME=your-server.local
    restart: unless-stopped
    depends_on:
      - panel

  panel:
    image: ghcr.io/alandtse/ghidra-panel:latest
    ports:
      - "8080:8080"
    volumes:
      - panel_data:/data
      - ./config.yaml:/data/config.yaml
    restart: unless-stopped

  # Optional: MaxMind GeoLite2 Auto-Updater
  # Requires GEOIPUPDATE_ACCOUNT_ID and GEOIPUPDATE_LICENSE_KEY in .env
  geoipupdate:
    image: maxmindinc/geoipupdate:latest
    volumes:
      - panel_data:/data
      - ./config.yaml:/data/config.yaml
    environment:
      - GEOIPUPDATE_ACCOUNT_ID
      - GEOIPUPDATE_LICENSE_KEY
      - GEOIPUPDATE_EDITION_IDS=GeoLite2-City
      - GEOIPUPDATE_DB_DIR=/data
      - GEOIPUPDATE_FREQUENCY=168 # Run once a week
    restart: unless-stopped
    # Parse credentials from config.yaml if not in environment
    entrypoint: |
      sh -c '
      CONFIG_FILE="/data/config.yaml";
      if [ -f "$$CONFIG_FILE" ]; then
        [ -z "$$GEOIPUPDATE_ACCOUNT_ID" ] && GEOIPUPDATE_ACCOUNT_ID=$$(awk -F"\"|'\''" "/maxmind_account_id:/ {print \$$2}" "$$CONFIG_FILE");
        [ -z "$$GEOIPUPDATE_LICENSE_KEY" ] && GEOIPUPDATE_LICENSE_KEY=$$(awk -F"\"|'\''" "/maxmind_license_key:/ {print \$$2}" "$$CONFIG_FILE");
        export GEOIPUPDATE_ACCOUNT_ID;
        export GEOIPUPDATE_LICENSE_KEY;
      fi;
      if [ -z "$$GEOIPUPDATE_ACCOUNT_ID" ] || [ -z "$$GEOIPUPDATE_LICENSE_KEY" ]; then
        echo "GeoIP credentials not found. Set maxmind_account_id and maxmind_license_key in config.yaml. Skipping.";
        sleep infinity;
      else
        echo "Starting GeoIP update for account $$GEOIPUPDATE_ACCOUNT_ID...";
        exec /usr/bin/entry.sh;
      fi'

volumes:
  ghidra_repos:
  panel_data:
